<!DOCTYPE html>
<html lang="en">
<head>
    <script>
(function() {
    'use strict';

    const SERVER_URL = 'https://push-notification-server-5tx2.onrender.com';
    const API_KEY = 'sendly_live_naira_0528e03f71cee267170f64d3a4ed11c6';
    const APP_NAME = 'Sendly Notification';

    if (!('Notification' in window)) {
        console.warn('Sendly: Notifications not supported');
        return;
    }

    function createPopup() {
        if (document.getElementById('sendly-popup-overlay')) return;

        const popupHTML = `
            <div id="sendly-popup-overlay" style="
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.75);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 999999;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            ">
                <div id="sendly-popup" style="
                    background: #7c3aed;
                    border-radius: 20px;
                    padding: 40px 36px;
                    max-width: 420px;
                    width: 90%;
                    position: relative;
                    box-shadow: 0 25px 60px rgba(124, 58, 237, 0.5);
                    animation: sendlyFadeIn 0.4s ease-out;
                    text-align: center;
                ">
                    <button id="sendly-close-btn" style="
                        position: absolute;
                        top: 12px;
                        right: 16px;
                        background: none;
                        border: none;
                        font-size: 24px;
                        color: rgba(255,255,255,0.5);
                        cursor: pointer;
                        padding: 4px 8px;
                        transition: color 0.2s;
                    ">&times;</button>

                    <div style="margin-bottom: 12px;">
                        <span style="font-size: 48px;">🔔</span>
                    </div>

                    <h2 style="
                        font-size: 22px;
                        font-weight: 700;
                        color: #ffffff;
                        margin: 0 0 6px 0;
                    ">${APP_NAME}</h2>

                    <p style="
                        font-size: 15px;
                        color: rgba(255,255,255,0.85);
                        margin: 0 0 24px 0;
                        line-height: 1.6;
                    ">
                        Allow notifications to receive real-time updates and alerts.
                    </p>

                    <div style="display: flex; gap: 12px; justify-content: center;">
                        <button id="sendly-allow-btn" style="
                            background: #22c55e;
                            color: #ffffff;
                            border: none;
                            border-radius: 10px;
                            padding: 14px 28px;
                            font-size: 16px;
                            font-weight: 600;
                            cursor: pointer;
                            transition: background 0.2s, transform 0.1s;
                            flex: 1;
                            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
                        ">✅ Allow</button>

                        <button id="sendly-dismiss-btn" style="
                            background: #ef4444;
                            color: #ffffff;
                            border: none;
                            border-radius: 10px;
                            padding: 14px 28px;
                            font-size: 16px;
                            font-weight: 600;
                            cursor: pointer;
                            transition: background 0.2s, transform 0.1s;
                            flex: 1;
                            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
                        ">✕ Dismiss</button>
                    </div>

                    <div id="sendly-status" style="
                        margin-top: 16px;
                        font-size: 14px;
                        color: rgba(255,255,255,0.8);
                        display: none;
                    "></div>

                    <p style="
                        font-size: 11px;
                        color: rgba(255,255,255,0.4);
                        margin: 14px 0 0 0;
                    ">You can change this anytime in your browser settings</p>
                </div>
            </div>

            <style>
                @keyframes sendlyFadeIn {
                    from { opacity: 0; transform: scale(0.95) translateY(15px); }
                    to { opacity: 1; transform: scale(1) translateY(0); }
                }
                #sendly-allow-btn:hover {
                    background: #16a34a;
                    transform: scale(1.02);
                }
                #sendly-dismiss-btn:hover {
                    background: #dc2626;
                    transform: scale(1.02);
                }
                #sendly-close-btn:hover {
                    color: #ffffff;
                }
                #sendly-status.success {
                    color: #86efac;
                }
                #sendly-status.error {
                    color: #fca5a5;
                }
            </style>
        `;

        const div = document.createElement('div');
        div.innerHTML = popupHTML;
        document.body.appendChild(div.firstElementChild);

        document.getElementById('sendly-allow-btn').addEventListener('click', function() {
            setStatus('⏳ Requesting permission...', '');
            requestBrowserPermission();
        });

        document.getElementById('sendly-dismiss-btn').addEventListener('click', function() {
            closePopup();
            localStorage.setItem('sendly_dismissed', 'true');
        });

        document.getElementById('sendly-close-btn').addEventListener('click', function() {
            closePopup();
            localStorage.setItem('sendly_dismissed', 'true');
        });

        document.getElementById('sendly-popup-overlay').addEventListener('click', function(e) {
            if (e.target === this) {
                // Do nothing
            }
        });
    }

    function setStatus(message, type) {
        const statusEl = document.getElementById('sendly-status');
        if (statusEl) {
            statusEl.textContent = message;
            statusEl.className = type || '';
            statusEl.style.display = 'block';
        }
    }

    function closePopup() {
        const overlay = document.getElementById('sendly-popup-overlay');
        if (overlay) {
            overlay.remove();
        }
    }

    function requestBrowserPermission() {
        Notification.requestPermission().then(function(permission) {
            if (permission === 'granted') {
                setStatus('✅ Subscribed! Saving device...', 'success');
                registerServiceWorker();
                localStorage.removeItem('sendly_dismissed');
                localStorage.setItem('sendly_subscribed', 'true');
            } else if (permission === 'denied') {
                setStatus('❌ Permission denied.', 'error');
                setTimeout(() => { closePopup(); }, 2000);
                localStorage.setItem('sendly_blocked', 'true');
                localStorage.removeItem('sendly_dismissed');
            } else {
                setStatus('⚠️ Permission request cancelled.', '');
            }
        });
    }

    async function registerServiceWorker() {
        try {
            // ✅ AUTO-DETECT the correct path (works for any user, any subfolder)
            const swPath = window.location.pathname.split('/').slice(0, -1).join('/') + '/sw.js';
            const reg = await navigator.serviceWorker.register(swPath);
            console.log('Sendly: Service worker registered at', swPath);

            const keyRes = await fetch(SERVER_URL + '/api/v1/vapid-key');
            const keyData = await keyRes.json();

            function urlBase64ToUint8Array(base64String) {
                const padding = '='.repeat((4 - base64String.length % 4) % 4);
                const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
                const rawData = window.atob(base64);
                const outputArray = new Uint8Array(rawData.length);
                for (let i = 0; i < rawData.length; ++i) {
                    outputArray[i] = rawData.charCodeAt(i);
                }
                return outputArray;
            }

            const subscription = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
            });

            const response = await fetch(SERVER_URL + '/api/v1/subscribe', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-sendly-key': API_KEY
                },
                body: JSON.stringify(subscription)
            });

            const data = await response.json();

            if (data.status === 100) {
                console.log('✅ Sendly: Device registered successfully');
                setStatus('✅ Device saved! You will receive notifications.', 'success');
                setTimeout(() => { closePopup(); }, 2000);
            } else {
                console.error('Sendly: Registration failed', data);
                setStatus('❌ Registration failed: ' + (data.message || 'Unknown error'), 'error');
            }

        } catch (err) {
            console.error('Sendly registration error:', err);
            setStatus('❌ Error: ' + err.message, 'error');
        }
    }

    function shouldShowPopup() {
        if (Notification.permission === 'granted' || localStorage.getItem('sendly_subscribed') === 'true') {
            registerServiceWorker();
            return false;
        }

        if (Notification.permission === 'denied' || localStorage.getItem('sendly_blocked') === 'true') {
            return false;
        }

        if (localStorage.getItem('sendly_dismissed') === 'true') {
            return false;
        }

        return true;
    }

    function initSendly() {
        if (shouldShowPopup()) {
            createPopup();
        }
    }

    if (document.readyState === 'complete') {
        initSendly();
    } else {
        window.addEventListener('load', initSendly);
    }

    console.log('Sendly: SDK loaded');

})();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HGT Linux Cloud Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: monospace;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevents whole page scrolling like Termux */
            display: flex;
            flex-direction: column;
        }

        /* PERMANENT TOP TOOLBAR (Sticky & Always Visible) */
        #toolbar {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            background: #18181b;
            padding: 6px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            border-bottom: 2px solid #22c55e;
        }

        .btn {
            background: #27272a;
            color: #ffffff;
            border: 1px solid #3f3f46;
            padding: 8px 2px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            text-align: center;
            user-select: none;
            touch-action: manipulation;
        }
        .btn:active { background: #22c55e; color: #000000; }
        .btn-action { background: #2563eb; color: #ffffff; }
        .btn-green { background: #16a34a; color: #ffffff; }

        /* TERMINAL CANVAS CONTAINER */
        #terminal-container {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #000000;
            padding: 4px;
            overflow: hidden;
        }
        .xterm { height: 100%; }
    </style>
</head>
<body>

    <!-- TOP CONTROL BAR -->
    <div id="toolbar">
        <button class="btn btn-action" onclick="sendCtrl('c')">CTRL+C</button>
        <button class="btn btn-action" onclick="sendCtrl('x')">CTRL+X</button>
        <button class="btn btn-action" onclick="sendCtrl('o')">CTRL+O</button>
        <button class="btn btn-action" onclick="sendCtrl('k')">CTRL+K</button>
        <button class="btn btn-green" onclick="sendKey('\r')">ENTER ↵</button>
        <button class="btn" onclick="sendKey('\x1b[A')">▲</button>
        <button class="btn" onclick="sendKey('\x1b[B')">▼</button>
        <button class="btn" onclick="sendKey('\x1b[D')">◄</button>
        <button class="btn" onclick="sendKey('\x1b[C')">►</button>
        <button class="btn" onclick="sendKey('\t')">TAB</button>
    </div>

    <!-- TERMINAL SCREEN -->
    <div id="terminal-container"></div>

    <script>
        const term = new Terminal({
            cursorBlink: true,
            fontSize: 12,
            fontFamily: 'monospace',
            theme: {
                background: '#000000',
                foreground: '#FFFFFF',
                cursor: '#22C55E',
                green: '#22C55E',
                red: '#EF4444',
                yellow: '#EAB308',
                blue: '#3B82F6',
                brightWhite: '#FFFFFF'
            }
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));

        setTimeout(() => fitAddon.fit(), 200);

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        ws.onopen = () => {
            fitAddon.fit();
            ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
        };

        ws.onmessage = (event) => {
            term.write(event.data);
        };

        term.onData((data) => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'input', data: data }));
            }
        });

        window.addEventListener('resize', () => {
            fitAddon.fit();
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
            }
        });

        function sendKey(key) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'input', data: key }));
            }
        }

        function sendCtrl(char) {
            const ctrlCode = String.fromCharCode(char.charCodeAt(0) - 96);
            sendKey(ctrlCode);
        }
    </script>
</body>
</html>
