<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HGT Linux Cloud Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #000000;
            color: #ffffff;
            font-family: monospace;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevents whole page scrolling like Termux */
            display: flex;
            flex-direction: column;
        }

        /* PERMANENT TOP TOOLBAR (Sticky & Always Visible) */
        #toolbar {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            background: #18181b;
            padding: 6px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            border-bottom: 2px solid #22c55e;
        }

        .btn {
            background: #27272a;
            color: #ffffff;
            border: 1px solid #3f3f46;
            padding: 8px 2px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            text-align: center;
            user-select: none;
            touch-action: manipulation;
        }
        .btn:active { background: #22c55e; color: #000000; }
        .btn-action { background: #2563eb; color: #ffffff; }
        .btn-green { background: #16a34a; color: #ffffff; }

        /* TERMINAL CANVAS CONTAINER */
        #terminal-container {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #000000;
            padding: 4px;
            overflow: hidden;
        }
        .xterm { height: 100%; }
    </style>
</head>
<body>

    <!-- TOP CONTROL BAR -->
    <div id="toolbar">
        <button class="btn btn-action" onclick="sendCtrl('c')">CTRL+C</button>
        <button class="btn btn-action" onclick="sendCtrl('x')">CTRL+X</button>
        <button class="btn btn-action" onclick="sendCtrl('o')">CTRL+O</button>
        <button class="btn btn-action" onclick="sendCtrl('k')">CTRL+K</button>
        <button class="btn btn-green" onclick="sendKey('\r')">ENTER ↵</button>
        <button class="btn" onclick="sendKey('\x1b[A')">▲</button>
        <button class="btn" onclick="sendKey('\x1b[B')">▼</button>
        <button class="btn" onclick="sendKey('\x1b[D')">◄</button>
        <button class="btn" onclick="sendKey('\x1b[C')">►</button>
        <button class="btn" onclick="sendKey('\t')">TAB</button>
    </div>

    <!-- TERMINAL SCREEN -->
    <div id="terminal-container"></div>

    <script>
        const term = new Terminal({
            cursorBlink: true,
            fontSize: 12,
            fontFamily: 'monospace',
            theme: {
                background: '#000000',
                foreground: '#FFFFFF',
                cursor: '#22C55E',
                green: '#22C55E',
                red: '#EF4444',
                yellow: '#EAB308',
                blue: '#3B82F6',
                brightWhite: '#FFFFFF'
            }
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));

        setTimeout(() => fitAddon.fit(), 200);

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        ws.onopen = () => {
            fitAddon.fit();
            ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
        };

        ws.onmessage = (event) => {
            term.write(event.data);
        };

        term.onData((data) => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'input', data: data }));
            }
        });

        window.addEventListener('resize', () => {
            fitAddon.fit();
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
            }
        });

        function sendKey(key) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'input', data: key }));
            }
        }

        function sendCtrl(char) {
            const ctrlCode = String.fromCharCode(char.charCodeAt(0) - 96);
            sendKey(ctrlCode);
        }
    </script>
</body>
</html>
