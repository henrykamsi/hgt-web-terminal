<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HGT Linux Cloud Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #header {
            background: #1a1a1a;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            color: #22c55e;
            border-bottom: 1px solid #333;
        }
        #terminal-container {
            flex: 1;
            padding: 5px;
            background: #000000;
        }
        #toolbar {
            background: #18181b;
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            border-top: 1px solid #27272a;
        }
        .btn {
            background: #27272a;
            color: #ffffff;
            border: 1px solid #3f3f46;
            padding: 10px 4px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            text-align: center;
            user-select: none;
        }
        .btn:active { background: #22c55e; color: #000; }
        .btn-action { background: #2563eb; }
        .btn-green { background: #16a34a; }
    </style>
</head>
<body>

    <div id="header">🚀 HGT LINUX CLOUD TERMINAL v1.3.0</div>
    <div id="terminal-container"></div>

    <div id="toolbar">
        <button class="btn btn-action" onclick="sendCtrl('c')">CTRL+C</button>
        <button class="btn btn-action" onclick="sendCtrl('x')">CTRL+X</button>
        <button class="btn btn-action" onclick="sendCtrl('o')">CTRL+O</button>
        <button class="btn btn-action" onclick="sendCtrl('k')">CTRL+K</button>
        <button class="btn btn-green" onclick="sendKey('\r')">ENTER ↵</button>
        <button class="btn" onclick="sendKey('\x1b[A')">▲</button>
        <button class="btn" onclick="sendKey('\x1b[B')">▼</button>
        <button class="btn" onclick="sendKey('\x1b[D')">◄</button>
        <button class="btn" onclick="sendKey('\x1b[C')">►</button>
        <button class="btn" onclick="sendKey('\t')">TAB</button>
    </div>

    <script>
        const term = new Terminal({
            cursorBlink: true,
            fontSize: 13,
            fontFamily: 'monospace',
            theme: {
                background: '#000000',
                foreground: '#FFFFFF', // High-contrast crisp white text
                cursor: '#22C55E',
                green: '#22C55E',     // Folder/path green
                red: '#EF4444',       // Error red
                yellow: '#EAB308',    // Warning yellow
                blue: '#3B82F6',      // Info blue
                brightWhite: '#FFFFFF'
            }
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        ws.onopen = () => {
            term.write('\r\n\x1b[1;32m[CONNECTED TO HGT CLOUD TTY SYSTEM]\x1b[0m\r\n\r\n');
            ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
        };

        ws.onmessage = (event) => {
            term.write(event.data);
        };

        term.onData((data) => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'input', data: data }));
            }
        });

        window.addEventListener('resize', () => {
            fitAddon.fit();
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
            }
        });

        function sendKey(key) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'input', data: key }));
            }
        }

        function sendCtrl(char) {
            const ctrlCode = String.fromCharCode(char.charCodeAt(0) - 96);
            sendKey(ctrlCode);
        }
    </script>
</body>
</html>
